name: CI

on:
  push:
    branches:
      - main
      - "gelistirme/**"
  pull_request:
    branches:
      - main

jobs:
  postgres-sema-dogrulama:
    name: PostgreSQL 18 Konteyner ve Şema Doğrulaması
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: kademeli_egitim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kademeli_egitim"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Kaynak kodu çek
        uses: actions/checkout@v4

      - name: appsettings.json test yapılandırmasını oluştur
        run: |
          cat << 'EOF' > appsettings.json
          {
            "ConnectionStrings": {
              "DefaultConnection": "Host=localhost;Port=5432;Database=kademeli_egitim;Username=postgres;Password=ci_test_password"
            },
            "DatabaseSettings": {
              "Provider": "PostgreSQL",
              "Version": "18",
              "CommandTimeoutSeconds": 30
            },
            "KademeAyarlari": {
              "KolayOrtaGecisBaraji": 70,
              "OrtaZorGecisBaraji": 75,
              "AraSinavSoruSayisi": 5
            }
          }
          EOF

      - name: PostgreSQL 18 konteynerinde database/schema.sql çalıştır
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql -h localhost -p 5432 -U postgres -d kademeli_egitim -v ON_ERROR_STOP=1 -f database/schema.sql
          psql -h localhost -p 5432 -U postgres -d kademeli_egitim -c "\dt"

  derle-ve-test:
    name: Derle ve Test Et (Windows + PostgreSQL)
    runs-on: windows-latest
    needs: postgres-sema-dogrulama

    steps:
      - name: Kaynak kodu çek
        uses: actions/checkout@v4

      - name: .NET 8 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Yerel PostgreSQL servisini başlat ve test veritabanını hazırla
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-Service -Name "postgresql*" -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue

          $pgBin = if ($env:PGBIN -and (Test-Path (Join-Path $env:PGBIN "psql.exe"))) {
              $env:PGBIN
          } else {
              (Get-ChildItem "C:\Program Files\PostgreSQL\*\bin" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          }

          if (-not $pgBin) {
              throw "PostgreSQL bin dizini Windows runner üzerinde bulunamadı."
          }

          $pgData = Join-Path $env:RUNNER_TEMP "pgdata"
          if (Test-Path $pgData) {
              Remove-Item -Recurse -Force $pgData
          }

          & (Join-Path $pgBin "initdb.exe") -D $pgData -U postgres -A trust --encoding=UTF8 --locale=C
          & (Join-Path $pgBin "pg_ctl.exe") -D $pgData -l (Join-Path $env:RUNNER_TEMP "pg.log") -o "-p 5432" start -w

          $psql = Join-Path $pgBin "psql.exe"
          & $psql -h localhost -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER USER postgres WITH PASSWORD 'ci_test_password';"
          & $psql -h localhost -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE kademeli_egitim WITH ENCODING 'UTF8';"
          & $psql -h localhost -p 5432 -U postgres -d kademeli_egitim -v ON_ERROR_STOP=1 -f "database/schema.sql"

      - name: appsettings.json test yapılandırmasını oluştur
        shell: pwsh
        run: |
          $json = @"
          {
            "ConnectionStrings": {
              "DefaultConnection": "Host=localhost;Port=5432;Database=kademeli_egitim;Username=postgres;Password=ci_test_password"
            },
            "DatabaseSettings": {
              "Provider": "PostgreSQL",
              "Version": "18",
              "CommandTimeoutSeconds": 30
            },
            "KademeAyarlari": {
              "KolayOrtaGecisBaraji": 70,
              "OrtaZorGecisBaraji": 75,
              "AraSinavSoruSayisi": 5
            }
          }
          "@
          [System.IO.File]::WriteAllText((Join-Path $PWD "appsettings.json"), $json, [System.Text.UTF8Encoding]::new($false))

      - name: Bağımlılıkları geri yükle
        run: dotnet restore tests/KademeliEgitimPlatformu.Tests/KademeliEgitimPlatformu.Tests.csproj

      - name: Release derlemesi
        run: dotnet build tests/KademeliEgitimPlatformu.Tests/KademeliEgitimPlatformu.Tests.csproj -c Release --no-restore

      - name: Testleri çalıştır
        shell: pwsh
        env:
          KEP_POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=kademeli_egitim;Username=postgres;Password=ci_test_password"
        run: dotnet test tests/KademeliEgitimPlatformu.Tests/KademeliEgitimPlatformu.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName!~Form1SmokeTests' --logger "trx;LogFileName=test-results.trx"

      - name: Test sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
